name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  project-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate TOML and local Markdown links
        run: python3 tools/check_project.py
      - name: Check Servo profile verdict logic
        run: PYTHONDONTWRITEBYTECODE=1 python3 prototypes/servo-mac-profiles/test_verdict.py

  wry-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Format smoke prototype
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-smoke/Cargo.toml --check
      - name: Clippy smoke prototype
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-smoke/Cargo.toml -- -D warnings
      - name: Build smoke prototype
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-smoke/Cargo.toml
      - name: Test smoke prototype
        run: cargo +1.99.1 test --locked --manifest-path prototypes/wry-smoke/Cargo.toml
      - name: Format profiles prototype
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-profiles/Cargo.toml --check
      - name: Clippy profiles prototype
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-profiles/Cargo.toml -- -D warnings
      - name: Build profiles prototype
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-profiles/Cargo.toml
      - name: Test profiles prototype
        run: cargo +1.99.1 test --locked --manifest-path prototypes/wry-profiles/Cargo.toml
      - name: Format permission diagnostic
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-permission-deny/Cargo.toml --check
      - name: Clippy permission diagnostic
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-permission-deny/Cargo.toml -- -D warnings
      - name: Build permission diagnostic
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-permission-deny/Cargo.toml
      - name: Test permission diagnostic logic
        run: cargo +1.99.1 test --locked --manifest-path prototypes/wry-permission-deny/Cargo.toml
      - name: Format download probe
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-download/Cargo.toml --check
      - name: Clippy download probe
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-download/Cargo.toml -- -D warnings
      - name: Build download probe
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-download/Cargo.toml

  wry-platform-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux WebKitGTK development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Format platform probe
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-platform-build/Cargo.toml --check
      - name: Clippy platform probe
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-platform-build/Cargo.toml -- -D warnings
      - name: Build platform probe
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-platform-build/Cargo.toml

  wry-linux-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install WebKitGTK and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb xauth xdotool imagemagick
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Format Linux runtime probe
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-linux-runtime/Cargo.toml --check
      - name: Clippy Linux runtime probe
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-linux-runtime/Cargo.toml -- -D warnings
      - name: Build Linux runtime probe
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-linux-runtime/Cargo.toml
      - name: Run under Xvfb
        run: timeout 90s xvfb-run -a --server-args='-screen 0 1280x800x24' prototypes/wry-linux-runtime/target/debug/search-wry-linux-runtime
      - name: Check rendered pixels and X11 input
        run: timeout 150s xvfb-run -a --server-args='-screen 0 1280x800x24' bash prototypes/wry-linux-runtime/run_visual_input.sh "$PWD/prototypes/wry-linux-runtime/target/debug/search-wry-linux-runtime"

  wry-linux-permission-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install WebKitGTK and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb xauth
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Format permission diagnostic
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-linux-permission-origin/Cargo.toml --check
      - name: Clippy permission diagnostic
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-linux-permission-origin/Cargo.toml -- -D warnings
      - name: Build permission diagnostic
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-linux-permission-origin/Cargo.toml
      - name: Test isolated permission page setup
        run: cargo +1.99.1 test --locked --manifest-path prototypes/wry-linux-permission-origin/Cargo.toml
      - name: Run local camera request with Deny
        shell: bash
        run: |
          set +e
          timeout 45s xvfb-run -a --server-args='-screen 0 1280x800x24' prototypes/wry-linux-permission-origin/target/debug/search-wry-linux-permission-origin --request-camera
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'Diagnostic pages completed. This does not prove origin-aware permission handling.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" -eq 1 ]; then
            echo 'Diagnostic incomplete; origin-aware permission handling remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Diagnostic failed with exit code $result" >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi
      - name: Isolate top-level camera request
        run: timeout 45s xvfb-run -a --server-args='-screen 0 1280x800x24' prototypes/wry-linux-permission-origin/target/debug/search-wry-linux-permission-origin --request-camera --scenario top-only
      - name: Isolate cross-origin iframe camera request
        run: timeout 45s xvfb-run -a --server-args='-screen 0 1280x800x24' prototypes/wry-linux-permission-origin/target/debug/search-wry-linux-permission-origin --request-camera --scenario cross-only

  servo-linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Servo runtime and virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick libxcursor1 libxrandr2 libxi6 libxkbcommon0 libvulkan1 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Run pinned ServoShell release on a local page
        run: timeout 180s xvfb-run -a --server-args='-screen 0 1280x800x24' bash prototypes/servo-linux-runtime/run.sh

  servo-windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run pinned ServoShell release on a local page
        shell: pwsh
        run: ./prototypes/servo-windows-runtime/run.ps1

  wry-windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Format Windows runtime probe
        run: cargo +1.99.1 fmt --manifest-path prototypes/wry-windows-runtime/Cargo.toml --check
      - name: Clippy Windows runtime probe
        run: cargo +1.99.1 clippy --locked --manifest-path prototypes/wry-windows-runtime/Cargo.toml -- -D warnings
      - name: Build Windows runtime probe
        run: cargo +1.99.1 build --locked --manifest-path prototypes/wry-windows-runtime/Cargo.toml
      - name: Run WebView2 with bounded wait
        shell: pwsh
        run: |
          $exe = "$PWD\prototypes\wry-windows-runtime\target\debug\search-wry-windows-runtime.exe"
          $stdout = Join-Path $env:RUNNER_TEMP 'search-wry-windows-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'search-wry-windows-stderr.log'
          try {
            $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(90000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $stderr) { Get-Content $stderr -ErrorAction SilentlyContinue | Write-Output }
              throw 'WebView2 probe exceeded 90 seconds'
            }
            $process.Refresh()
            $log = Get-Content $stderr -Raw
            Write-Output $log
            if ($process.ExitCode -ne 0) {
              if (Test-Path $stdout) { Get-Content $stdout | Write-Output }
              throw "WebView2 probe exited with code $($process.ExitCode)"
            }
            if ($log -notmatch 'PASS: local HTML changed the document title via JavaScript') { throw 'Expected JavaScript marker missing' }
          } finally {
            Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
          }
