[package]
name = "search-browser"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tao = "=0.37.2"
url = "=2.5.8"
wry = "=0.57.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSEvent", "NSWindow", "NSSavePanel", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSURL"] }
tempfile = "=3.27.0"

[patch.crates-io]
wry = { path = "vendor/wry" }
