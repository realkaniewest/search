<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<style>
  :root { color-scheme: dark; font: 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: #f2f2f2; overflow: hidden; }
  .bar { position: relative; height: 50px; display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 78px; border-bottom: 1px solid #ffffff12; background: linear-gradient(112deg, #292c32d9, #202126e6); }
  @media (prefers-reduced-transparency: reduce) { .bar { background: #272930; } }
  .navigation { display: flex; flex: none; gap: 2px; margin-right: 6px; }
  .tab-strip {
    --strip-width: 240px;
    display: flex;
    flex: 0 1 var(--strip-width);
    min-width: 0;
    align-items: center;
    margin-inline: auto;
  }
  .tab-strip:has(.tab:nth-child(2)) { --strip-width: 480px; }
  .tab-strip:has(.tab:nth-child(3)) { --strip-width: 640px; }
  .tab-strip:has(.tab:nth-child(4)) { --strip-width: 820px; }
  .tab-scroll { min-width: 24px; padding: 0; font-size: 17px; }
  .tab-scroll[hidden] { display: none; }
  .tabs { display: flex; min-width: 0; flex: 1; gap: 0; overflow-x: auto; scrollbar-width: none; border-radius: 19px; background: #ffffff0e; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; flex: 1 0 125px; max-width: 230px; min-width: 0; height: 32px; color: #c5c5c7; display: flex; align-items: center; padding: 0 5px 0 13px; }
  .tab + .tab::before { content: ''; position: absolute; left: 0; top: 8px; height: 16px; width: 1px; background: #ffffff1c; }
  .tab.active { background: #ffffff13; color: #f7f7f7; border-radius: 17px; }
  .tab.active::before,.tab.active + .tab::before { opacity: 0; }
  .tab .dot { width: 8px; height: 8px; flex: none; border-radius: 3px; background: #98999d; }
  .tab .dot.loading { border: 1px solid #f0f0f0; border-top-color: transparent; border-radius: 50%; background: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tab .dot.loading { animation: none; border-color: #f0f0f0; } }
  .tab .select { min-width: 0; flex: 1; height: 100%; border: 0; background: none; color: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 0; font: inherit; }
  .tab .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
  .tab .close { flex: none; width: 25px; height: 25px; border: 0; border-radius: 50%; background: none; color: inherit; opacity: .6; font-size: 17px; cursor: pointer; }
  .tab .close:hover { background: #ffffff22; opacity: 1; }
  .tool { flex: none; height: 32px; min-width: 32px; border: 0; border-radius: 12px; color: #c9c9cb; background: transparent; cursor: pointer; font-size: 21px; }
  .reload { font-size: 17px; }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool:enabled:hover,.tab:hover { background: #ffffff17; }
  .address { width: clamp(190px,29vw,410px); height: 32px; border-radius: 16px; border: 1px solid #ffffff38; background: linear-gradient(#ffffff16, #ffffff06); color: #f2f2f2; padding: 0 12px; outline: none; box-shadow: inset 0 1px #ffffff14; }
  .address::placeholder { color: #a8a8aa; }
  .address:focus { border-color: #bcbec2; box-shadow: 0 0 0 3px #ffffff18; }
  .address[aria-invalid="true"] { border-color: #d4a8a3; }
  .notice { position: absolute; bottom: 1px; right: 16px; max-width: min(390px,45vw); color: #efc2bc; font-size: 11px; background: #262830; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar:has(.notice:not(:empty)) { align-items: flex-start; padding-top: 3px; }
  .activity { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  :focus-visible { outline: 2px solid #d0d0d2; outline-offset: 2px; }
  @media(max-width:820px) { .bar { padding-left: 16px; gap: 5px; } .navigation { margin-right: 1px; } .tab { flex-basis: 110px; } .address { width: 190px; } }
  .mac-toolbar .bar { padding-left: 82px; }

  .navigation, #add {
    border-radius: 13px;
    background: #ffffff08;
    box-shadow: inset 0 1px #ffffff0d;
  }
  .tab.active {
    background: linear-gradient(#ffffff22, #ffffff0e);
    box-shadow: inset 0 1px #ffffff18;
  }
  .tab.active .dot:not(.loading) { background: #b7c9e1; }
  .address:focus { border-color: #bccde3; box-shadow: 0 0 0 2px #b4c9ef24; }
  .select:focus-visible { outline-offset: -2px; border-radius: 8px; }
  @media (prefers-reduced-motion: no-preference) {
    .tool, .close, .tab { transition: background-color 140ms ease, color 140ms ease, opacity 140ms ease, transform 130ms ease; }
    .address { transition: border-color 160ms ease, box-shadow 160ms ease; }
    .tool:active, .close:active { transform: scale(.92); }
    .tab.just-selected { animation: tab-settle 170ms ease-out; }
    @keyframes tab-settle {
      from { background-color: #bdd3ef38; }
    }
  }
  .bar { gap: 8px; background: linear-gradient(115deg, #303238c4, #222328d9); }
  .tabs { gap: 0; border-radius: 16px; background: #ffffff0c; }
  .tab { flex: 1 1 0; min-width: 29px; max-width: none; padding: 0; container-type: inline-size; }
  .tab.active { flex: 1 1 0; min-width: 125px; border-radius: 15px; border: 1px solid #ffffff22; }
  .tab .select { justify-content: center; padding: 0 27px; gap: 6px; }
  .tab .name { flex: 0 1 auto; text-align: center; }
  .tab.active .select { cursor: text; }
  .tab .hint { display: none; color: #bdbec4; }
  .tab.active .select:has(.hint) .dot { display: none; }
  .tab.active .hint { display: inline; }
  .tab.active .select:has(.hint) .name { display: none; }
  .tab .dot { width: 10px; height: 10px; border-radius: 50%; }
  .tab .close { position: absolute; right: 3px; top: 5px; width: 22px; height: 22px; padding: 0; opacity: 0; }
  .tab:hover .close,.tab:focus-within .close { opacity: 1; }
  .tab .close:hover { background: #ffffff20; }
  .tab .close:disabled { display: none; }
  .tab .address { position: absolute; inset: 1px 27px 1px 1px; width: auto; height: auto; border-radius: 10px; padding: 0 9px; }
  .tab .address[hidden] { display: none; }
  .tab .address:focus { box-shadow: inset 0 0 0 1px #bed2eb55; }
  .tab.editing .select { visibility: hidden; }
  @container (max-width: 64px) {
    .tab:not(.active) .name { display: none; }
    .tab:not(.active) .select { padding: 0; }
    .tab:not(.active) .close:not(:focus-visible) { opacity: 0; pointer-events: none; }
  }
  @media (prefers-reduced-transparency: reduce) { .bar { background: #292b31; } }
  @media (prefers-reduced-motion: no-preference) {
    .tab.just-opened { animation: tab-appear 120ms ease-out; }
    .tab .address:not([hidden]) { animation: address-appear 140ms ease-out; }
    @keyframes tab-appear { from { opacity: .55; } }
    @keyframes address-appear { from { opacity: 0; transform: translateY(3px) scale(.97); } }
  }
  .search-engine { display: none; color: #e2e7ef; background: #303238; border: 1px solid #ffffff22; border-radius: 9px; padding: 4px; font: inherit; }
  .https-preview .search-engine { display: inline-block; }
  .preview-label { display: none; }
  .https-preview .preview-label { display: inline; color: #bbc5d4; font-size: 11px; }
</style>
<div class="bar"><div class="navigation"><button class="tool" id="back" disabled aria-label="Назад">‹</button><button class="tool" id="forward" disabled aria-label="Вперёд">›</button><button class="tool reload" id="reload" aria-label="Обновить страницу" title="Обновить страницу">↻</button></div><div class="tab-strip"><button class="tool tab-scroll" id="tabs-left" aria-label="Прокрутить вкладки влево" hidden>‹</button><div class="tabs" id="tabs" role="tablist" aria-label="Вкладки"></div><button class="tool tab-scroll" id="tabs-right" aria-label="Прокрутить вкладки вправо" hidden>›</button></div><button class="tool" id="add" aria-label="Новая вкладка">+</button><select id="search-engine" class="search-engine" aria-label="Поисковая система"><option value="google">Google</option><option value="yandex">Яндекс</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select><span class="preview-label">HTTPS Preview</span><span class="activity" id="activity" role="status" aria-live="polite"></span><span class="notice" id="notice" role="status" aria-live="polite"></span></div>
<input class="address" id="address" aria-label="Адрес" placeholder="Адрес или сайт" hidden aria-describedby="notice">
<script>
  'use strict';
  const tabs = document.getElementById('tabs'), address = document.getElementById('address'), notice = document.getElementById('notice'), activity = document.getElementById('activity');
  const tabsLeft = document.getElementById('tabs-left'), tabsRight = document.getElementById('tabs-right');
  function updateTabScroll() {
    const controlsWidth = tabsLeft.hidden ? 0 : tabsLeft.offsetWidth + tabsRight.offsetWidth;
    const overflow = tabs.scrollWidth > tabs.clientWidth + controlsWidth + 1;
    tabsLeft.hidden = tabsRight.hidden = !overflow;
    tabsLeft.disabled = tabs.scrollLeft <= 1;
    tabsRight.disabled = tabs.scrollLeft >= tabs.scrollWidth - tabs.clientWidth - 1;
  }
  tabsLeft.onclick = () => tabs.scrollBy({left:-tabs.clientWidth});
  tabsRight.onclick = () => tabs.scrollBy({left:tabs.clientWidth});
  tabs.addEventListener('scroll', updateTabScroll);
  new ResizeObserver(updateTabScroll).observe(tabs.parentElement);
  let editorTab;
  let renderingTabs = false;
  function editAddress() {
    if (!editorTab) return;
    editorTab.classList.add('editing');
    address.hidden = false;
    editorTab.scrollIntoView({block:'nearest',inline:'nearest'});
    address.focus();
    address.select();
  }
  function hideAddress() {
    if (renderingTabs) return;
    editorTab?.classList.remove('editing');
    address.hidden = true;
  }
  address.addEventListener('blur', hideAddress);
  const send = value => window.ipc.postMessage(JSON.stringify(value));
  document.getElementById('add').onclick = () => send({type:'new'});
  document.getElementById('back').onclick = () => send({type:'back'});
  document.getElementById('forward').onclick = () => send({type:'forward'});
  document.getElementById('reload').onclick = () => send({type:'reload'});
  address.addEventListener('keydown', e => {
    if(e.isComposing) return;
    if(e.key === 'Escape') {
      e.preventDefault();
      const {active, tabs: stateTabs} = window.searchState;
      address.value = displayAddress(stateTabs[active]?.url);
      notice.textContent = '';
      address.setAttribute('aria-invalid', 'false');
      send({type:'cancel-address'});
      address.blur();
      editorTab?.querySelector('[role="tab"]')?.focus();
      return;
    }
    if(e.key!=='Enter' || !address.value.trim()) return;
    const command={type:'open',value:address.value};
    if (document.documentElement?.classList.contains('https-preview')) {
      command.engine = document.getElementById('search-engine').value;
    }
    const encoder=new TextEncoder();
    if(encoder.encode(address.value).length>1024 || encoder.encode(JSON.stringify(command)).length>2048) {
      notice.textContent='Адрес слишком длинный. Сократи его и попробуй снова.';
      address.setAttribute('aria-invalid','true');
      return;
    }
    send(command); address.blur();
  });
  address.addEventListener('input', () => { notice.textContent=''; address.setAttribute('aria-invalid','false'); });
  function tabShortcut(event, state) {
    if (event.altKey || !state.tabs.length) return;
    const count = state.tabs.length;
    if (event.ctrlKey && !event.metaKey && event.key === 'Tab') {
      const direction = event.shiftKey ? -1 : 1;
      return state.tabs[(state.active + direction + count) % count];
    }
    if ((event.metaKey || event.ctrlKey) && !event.shiftKey && /^[1-9]$/.test(event.key)) {
      return state.tabs[event.key === '9' ? count - 1 : Number(event.key) - 1];
    }
  }
  document.addEventListener('keydown', e => {
    if (e.isComposing || e.defaultPrevented) return;
    const target = tabShortcut(e, window.searchState);
    if (target) {
      e.preventDefault();
      if (target.id !== window.searchState.tabs[window.searchState.active]?.id) {
        if (document.activeElement?.getAttribute('role') === 'tab') {
          const index = window.searchState.tabs.indexOf(target);
          tabs.querySelector(`[role="tab"][data-index="${index}"]`)?.focus({preventScroll:true});
        }
        send({type:'select',id:target.id});
      }
      return;
    }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='t') { e.preventDefault(); send({type:e.shiftKey?'reopen':'new'}); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='l') { e.preventDefault(); editAddress(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='r') { e.preventDefault(); send({type:'reload'}); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='w') {
      e.preventDefault();
      const { active, tabs: stateTabs } = window.searchState;
      const tab = stateTabs[active];
      if(tab) send({type:'close',id:tab.id});
    }
  });
  const displayAddress = url => url === 'search:start' ? '' : url ?? '';
  window.searchState = {active:0,tabs:[]};
  function renderTabs(state, previous, activeChanged) {
    const focused = document.activeElement;
    const focusedIndex = focused?.dataset?.index;
    const focusedAction = focused?.dataset?.action;
    const keepEditor = focused === address && !activeChanged;
    const selectionStart = address.selectionStart, selectionEnd = address.selectionEnd;
    renderingTabs = true;
    tabs.replaceChildren();
    state.tabs.forEach((tab,index) => {
      const item = document.createElement('div'); item.className='tab'+(index===state.active?' active':'')+(index===state.active && activeChanged?' just-selected':'');
      if (previous.tabs.length && !previous.tabs.some(before => before.id === tab.id)) item.className += ' just-opened';
      const button = document.createElement('button'); button.className='select'; button.type='button'; button.dataset.action='select'; button.dataset.index=index; button.setAttribute('role','tab'); button.setAttribute('aria-selected',index===state.active?'true':'false'); button.setAttribute('aria-label',tab.loading?tab.label+' загружается':tab.label); button.tabIndex=index===state.active?0:-1;
      const dot=document.createElement('span'); dot.className='dot'+(tab.loading?' loading':'');
      const name=document.createElement('span'); name.className='name'; name.textContent=tab.label; button.title=tab.label;
      const close=document.createElement('button'); close.className='close'; close.type='button'; close.dataset.action='close'; close.dataset.index=index; close.textContent='×'; close.setAttribute('aria-label','Закрыть вкладку '+tab.label);
      close.disabled = state.tabs.length === 1;
      close.onclick=()=>send({type:'close',id:tab.id});
      button.onclick=()=>index===state.active ? editAddress() : send({type:'select',id:tab.id});
      button.addEventListener('auxclick', event => {
        if (event.button === 1 && !close.disabled) {
          event.preventDefault();
          close.onclick();
        }
      });
      button.append(dot,name);
      if (tab.url === 'search:start') {
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = document.documentElement?.classList.contains('https-preview') ? 'Поиск или адрес' : 'Адрес или сайт';
        hint.setAttribute('aria-hidden', 'true');
        button.append(hint);
      }
      item.append(button,close);
      if (index===state.active) {
        editorTab = item;
        item.append(address);
      }
      tabs.append(item);
    });
    renderingTabs = false;
    if (keepEditor) {
      editAddress();
      if (selectionStart !== null) address.setSelectionRange(selectionStart, selectionEnd);
    } else {
      hideAddress();
    }
    updateTabScroll();
    if (activeChanged) tabs.querySelector(`[role="tab"][data-index="${state.active}"]`)?.scrollIntoView({block:'nearest',inline:'nearest'});
    if(focusedIndex!==undefined && state.tabs.length) {
      const previousIndex = Number(focusedIndex);
      const previousId = previous.tabs[previousIndex]?.id;
      const remainingIndex = previousId === undefined ? previousIndex
        : state.tabs.findIndex(tab => tab.id === previousId);
      const remaining = remainingIndex >= 0 && remainingIndex < state.tabs.length;
      const index = remaining ? remainingIndex : state.active;
      const action = remaining ? focusedAction : 'select';
      tabs.querySelector(`[data-action="${action}"][data-index="${index}"]`)?.focus({preventScroll:true});
    }
  }
  window.renderSearch = state => {
    if (document.documentElement?.classList.contains('https-preview')) address.placeholder = 'Поиск или адрес';
    const previous = window.searchState;
    const currentId = state.tabs[state.active]?.id;
    const previousId = previous.tabs[previous.active]?.id;
    const activeChanged = currentId === undefined && previousId === undefined
      ? state.active !== previous.active : currentId !== previousId;
    const tabsChanged = activeChanged || state.active !== previous.active || state.tabs.length !== previous.tabs.length
      || state.tabs.some((tab, index) => {
        const before = previous.tabs[index];
        return tab.id !== before.id || tab.label !== before.label || (tab.url === 'search:start') !== (before.url === 'search:start') || tab.loading !== before.loading;
      });
    window.searchState = state;
    if (tabsChanged) renderTabs(state, previous, activeChanged);

    document.getElementById('back').disabled = !state.can_back;
    document.getElementById('forward').disabled = !state.can_forward;
    const activeTab = state.tabs[state.active];
    document.getElementById('reload').disabled = !activeTab || activeTab.url === 'search:start';
    if(document.activeElement!==address || activeChanged) {
      const url = state.tabs[state.active]?.url;
      address.value = state.attempted_address ?? displayAddress(url);
    }
    if (state.attempted_address != null && address.hidden) editAddress();
    notice.textContent=state.notice ?? '';
    activity.textContent=!state.notice && state.tabs[state.active]?.loading?'Загрузка страницы…':'';
    address.setAttribute('aria-invalid',state.attempted_address != null?'true':'false');
  };
  tabs.addEventListener('keydown', e => {
    const tab=e.target.closest('[role="tab"]');
    if(!tab) return;
    const index=Number(tab.dataset.index), count=window.searchState.tabs.length;
    if(!count) return;
    let next;
    if(e.key==='ArrowRight') next=(index+1)%count;
    else if(e.key==='ArrowLeft') next=(index+count-1)%count;
    else if(e.key==='Home') next=0;
    else if(e.key==='End') next=count-1;
    else if(e.key==='Delete') { e.preventDefault(); send({type:'close',id:window.searchState.tabs[index].id}); return; }
    else return;
    e.preventDefault();
    tabs.querySelector(`[role="tab"][data-index="${next}"]`)?.focus();
    send({type:'select',id:window.searchState.tabs[next].id});
  });
</script>
