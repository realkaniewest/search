<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<style>
  :root { color-scheme: dark; font: 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #273034; color: #edf1f1; overflow: hidden; }
  .bar { height: 76px; display: flex; align-items: center; gap: 8px; padding: 12px 16px 12px 78px; border-bottom: 1px solid #4b585b; background: linear-gradient(110deg,#303a3d,#252d31); }
  .brand { font-weight: 660; letter-spacing: -.04em; font-size: 16px; margin-right: 8px; color: #f2f5f4; }
  .tabs { display: flex; min-width: 0; flex: 1; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 146px; min-width: 0; height: 43px; border-radius: 14px; background: #ffffff0c; color: #c8d2d2; border: 1px solid transparent; display: flex; align-items: center; padding: 0 5px 0 10px; }
  .tab.active { background: #ffffff20; border-color: #ffffff35; color: white; box-shadow: inset 0 1px #ffffff18; }
  .tab .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #9cb9b5; }
  .tab .select { min-width: 0; flex: 1; height: 100%; border: 0; background: none; color: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 0; font: inherit; }
  .tab .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
  .tab .close { flex: none; width: 27px; height: 27px; border: 0; border-radius: 8px; background: none; color: inherit; opacity: .72; font-size: 17px; cursor: pointer; }
  .tab .close:hover { background: #ffffff25; opacity: 1; }
  .tool { flex: none; height: 36px; min-width: 36px; border: 1px solid #ffffff20; border-radius: 12px; color: #e1e9e8; background: #ffffff10; cursor: pointer; font-size: 18px; }
  .tool:hover,.tab:hover { background: #ffffff25; }
  .address { width: clamp(180px,27vw,390px); height: 42px; border-radius: 15px; border: 1px solid #ffffff3b; background: #10181b80; color: #edf1f1; padding: 0 15px; outline: none; }
  .address:focus { border-color: #a3c2be; box-shadow: 0 0 0 2px #a3c2be28; }
  :focus-visible { outline: 2px solid #b7d4d0; outline-offset: 2px; }
  @media(max-width:820px) { .bar { padding-left: 20px; } .brand { display:none; } .tab { flex-basis: 110px; } .address { width: 180px; } }
</style>
<div class="bar"><span class="brand">Search</span><button class="tool" id="back" aria-label="Назад">‹</button><button class="tool" id="forward" aria-label="Вперёд">›</button><div class="tabs" id="tabs" role="tablist" aria-label="Вкладки"></div><button class="tool" id="add" aria-label="Новая вкладка">+</button><input class="address" id="address" aria-label="Адрес" placeholder="Rust, Wikipedia, Excalidraw"></div>
<script>
  'use strict';
  const tabs = document.getElementById('tabs'), address = document.getElementById('address');
  const send = value => window.ipc.postMessage(JSON.stringify(value));
  document.getElementById('add').onclick = () => send({type:'new'});
  document.getElementById('back').onclick = () => send({type:'back'});
  document.getElementById('forward').onclick = () => send({type:'forward'});
  address.addEventListener('keydown', e => { if(e.key==='Enter') { send({type:'open',value:address.value}); address.blur(); } });
  document.addEventListener('keydown', e => {
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='t') { e.preventDefault(); send({type:'new'}); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='l') { e.preventDefault(); address.focus(); address.select(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='w') { e.preventDefault(); send({type:'close',index:window.searchState.active}); }
  });
  window.searchState = {active:0,tabs:[]};
  window.renderSearch = state => {
    const focused = document.activeElement;
    const focusedIndex = focused?.dataset?.index;
    const focusedAction = focused?.dataset?.action;
    const activeChanged = state.active !== window.searchState.active;
    window.searchState = state;
    tabs.replaceChildren();
    state.tabs.forEach((tab,index) => {
      const item = document.createElement('div'); item.className='tab'+(index===state.active?' active':'');
      const button = document.createElement('button'); button.className='select'; button.type='button'; button.dataset.action='select'; button.dataset.index=index; button.setAttribute('role','tab'); button.setAttribute('aria-selected',index===state.active?'true':'false'); button.tabIndex=index===state.active?0:-1;
      const dot=document.createElement('span'); dot.className='dot';
      const name=document.createElement('span'); name.className='name'; name.textContent=tab.label;
      const close=document.createElement('button'); close.className='close'; close.type='button'; close.dataset.action='close'; close.dataset.index=index; close.textContent='×'; close.setAttribute('aria-label','Закрыть вкладку '+tab.label);
      close.onclick=()=>send({type:'close',index});
      button.onclick=()=>send({type:'select',index}); button.append(dot,name); item.append(button,close); tabs.append(item);
    });
    if(document.activeElement!==address || activeChanged) address.value=state.tabs[state.active]?.url||'';
    if(focusedIndex!==undefined && state.tabs.length) {
      const index=Math.min(Number(focusedIndex),state.tabs.length-1);
      tabs.querySelector(`[data-action="${focusedAction}"][data-index="${index}"]`)?.focus();
    }
  };
  tabs.addEventListener('keydown', e => {
    const tab=e.target.closest('[role="tab"]');
    if(!tab) return;
    const index=Number(tab.dataset.index), count=window.searchState.tabs.length;
    if(!count) return;
    let next;
    if(e.key==='ArrowRight') next=(index+1)%count;
    else if(e.key==='ArrowLeft') next=(index+count-1)%count;
    else if(e.key==='Home') next=0;
    else if(e.key==='End') next=count-1;
    else if(e.key==='Delete') { e.preventDefault(); send({type:'close',index}); return; }
    else return;
    e.preventDefault();
    tabs.querySelector(`[role="tab"][data-index="${next}"]`)?.focus();
    send({type:'select',index:next});
  });
</script>
</html>
