<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<style>
  :root { color-scheme: dark; font: 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: #f2f2f2; overflow: hidden; }
  .bar { position: relative; height: 50px; display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-bottom: 1px solid #ffffff12; background: linear-gradient(112deg, #292c32d9, #202126e6); }
  @media (prefers-reduced-transparency: reduce) { .bar { background: #272930; } }
  .tool-group { display: flex; flex: none; gap: 1px; border-radius: 11px; background: #ffffff07; box-shadow: inset 0 0 0 1px #ffffff0a; }
  .tab-strip {
    --strip-width: 240px;
    display: flex;
    flex: 0 1 var(--strip-width);
    min-width: 0;
    align-items: center;
    margin-inline: auto;
  }
  .tab-strip:has(.tab:nth-child(2)) { --strip-width: 480px; }
  .tab-strip:has(.tab:nth-child(3)) { --strip-width: 640px; }
  .tab-strip:has(.tab:nth-child(4)) { --strip-width: 820px; }
  .tab-scroll { min-width: 24px; padding: 0; }
  .tab-scroll[hidden] { display: none; }
  .tabs { display: flex; min-width: 0; flex: 1; gap: 0; overflow-x: auto; scrollbar-width: none; border-radius: 19px; background: #ffffff0e; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; flex: 1 0 125px; max-width: 230px; min-width: 0; height: 32px; color: #c5c5c7; display: flex; align-items: center; padding: 0 5px 0 13px; }
  .tab + .tab::before { content: ''; position: absolute; left: 0; top: 8px; height: 16px; width: 1px; background: #ffffff1c; }
  .tab.active { background: #ffffff13; color: #f7f7f7; border-radius: 17px; }
  .tab.active::before,.tab.active + .tab::before { opacity: 0; }
  .tab .dot { width: 8px; height: 8px; flex: none; border-radius: 3px; background: #98999d; }
  .tab .dot.loading { border: 1px solid #f0f0f0; border-top-color: transparent; border-radius: 50%; background: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tab .dot.loading { animation: none; border-color: #f0f0f0; } }
  .tab .select { min-width: 0; flex: 1; height: 100%; border: 0; background: none; color: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 0; font: inherit; }
  .tab .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
  .tab .close { flex: none; width: 25px; height: 25px; border: 0; border-radius: 50%; background: none; color: inherit; opacity: .6; font-size: 17px; cursor: pointer; }
  .tab .close:hover { background: #ffffff22; opacity: 1; }
  .tool { display: inline-grid; place-items: center; flex: none; height: 32px; min-width: 30px; padding: 0; border: 0; border-radius: 10px; color: #c4c5ca; background: transparent; cursor: pointer; }
  .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #bookmark-toggle[aria-pressed="true"] .icon { fill: currentColor; }
  #download-open .icon-cancel, #download-open[data-active="true"] .icon-download { display: none; }
  #download-open[data-active="true"] .icon-cancel { display: block; }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool:enabled:hover,.tab:hover { background: #ffffff17; }
  .address { width: clamp(190px,29vw,410px); height: 32px; border-radius: 16px; border: 1px solid #ffffff38; background: linear-gradient(#ffffff16, #ffffff06); color: #f2f2f2; padding: 0 12px; outline: none; box-shadow: inset 0 1px #ffffff14; }
  .address::placeholder { color: #a8a8aa; }
  .address:focus { border-color: #bcbec2; box-shadow: 0 0 0 3px #ffffff18; }
  .address[aria-invalid="true"] { border-color: #d4a8a3; }
  .notice { position: absolute; bottom: 1px; right: 16px; max-width: min(390px,45vw); color: #efc2bc; font-size: 11px; background: #262830; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar:has(.notice:not(:empty)) { align-items: flex-start; padding-top: 3px; }
  .activity { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  :focus-visible { outline: 2px solid #d0d0d2; outline-offset: 2px; }
  @media(max-width:820px) { .bar { padding-left: 16px; gap: 5px; } .tab { flex-basis: 110px; } .address { width: 190px; } }
  .mac-toolbar .bar { padding-left: 82px; }

  #add {
    border-radius: 13px;
    background: #ffffff08;
    box-shadow: inset 0 1px #ffffff0d;
  }
  .tab.active {
    background: linear-gradient(#ffffff22, #ffffff0e);
    box-shadow: inset 0 1px #ffffff18;
  }
  .tab.active .dot:not(.loading) { background: #b7c9e1; }
  .address:focus { border-color: #bccde3; box-shadow: 0 0 0 2px #b4c9ef24; }
  .select:focus-visible { outline-offset: -2px; border-radius: 8px; }
  @media (prefers-reduced-motion: no-preference) {
    .tool, .close, .tab { transition: background-color 140ms ease, color 140ms ease, opacity 140ms ease, transform 130ms ease; }
    .address { transition: border-color 160ms ease, box-shadow 160ms ease; }
    .tool:active, .close:active { transform: scale(.92); }
    .tab.just-selected { animation: tab-settle 170ms ease-out; }
    @keyframes tab-settle {
      from { background-color: #bdd3ef38; }
    }
  }
  .bar { gap: 8px; background: linear-gradient(115deg, #303238c4, #222328d9); }
  .tabs { gap: 0; border-radius: 16px; background: #ffffff0c; }
  .tab { flex: 1 1 0; min-width: 29px; max-width: none; padding: 0; container-type: inline-size; }
  .tab.active { flex: 1 1 0; min-width: 125px; border-radius: 15px; border: 1px solid #ffffff22; }
  .tab .select { justify-content: center; padding: 0 27px; gap: 6px; }
  .tab .name { flex: 0 1 auto; text-align: center; }
  .tab.active .select { cursor: text; }
  .tab .hint { display: none; color: #bdbec4; }
  .tab.active .select:has(.hint) .dot { display: none; }
  .tab.active .hint { display: inline; }
  .tab.active .select:has(.hint) .name { display: none; }
  .tab .dot { width: 10px; height: 10px; border-radius: 50%; }
  .tab .close { position: absolute; right: 3px; top: 5px; width: 22px; height: 22px; padding: 0; opacity: 0; }
  .tab:hover .close,.tab:focus-within .close { opacity: 1; }
  .tab .close:hover { background: #ffffff20; }
  .tab .close:disabled { display: none; }
  .tab .address { position: absolute; inset: 1px 27px 1px 1px; width: auto; height: auto; border-radius: 10px; padding: 0 9px; }
  .tab .address[hidden] { display: none; }
  .tab .address:focus { box-shadow: inset 0 0 0 1px #bed2eb55; }
  .tab.editing .select { visibility: hidden; }
  @container (max-width: 64px) {
    .tab:not(.active) .name { display: none; }
    .tab:not(.active) .select { padding: 0; }
    .tab:not(.active) .close:not(:focus-visible) { opacity: 0; pointer-events: none; }
  }
  @media (prefers-reduced-transparency: reduce) { .bar { background: #292b31; } }
  @media (prefers-reduced-motion: no-preference) {
    .tab.just-opened { animation: tab-appear 120ms ease-out; }
    .tab .address:not([hidden]) { animation: address-appear 140ms ease-out; }
    @keyframes tab-appear { from { opacity: .55; } }
    @keyframes address-appear { from { opacity: 0; transform: translateY(3px) scale(.97); } }
  }
  .composer[hidden] { display: none; }
  .composer {
    position: fixed; inset: 0; z-index: 5;
    background: radial-gradient(ellipse at 50% 18%, #242426 0, #171719 37%, #0c0c0e 100%);
  }
  .composer-row {
    position: absolute; top: clamp(77px, 21vh, 205px); left: 50%;
    transform: translateX(-50%); width: min(670px, calc(100% - 48px));
    display: flex; align-items: center; gap: 10px;
  }
  .composer-panel {
    flex: 1; min-width: 0; height: 55px;
    display: flex; align-items: center; gap: 16px; padding: 0 18px;
    border-radius: 26px; border: 1px solid #ffffff29;
    background: linear-gradient(168deg, #ffffff18, #ffffff08 75%);
    box-shadow: 0 16px 38px #0006, inset 0 1px #ffffff10;
  }
  .composer-engine { position: relative; flex: none; }
  .engine-toggle, .engine-choice {
    display: grid; place-items: center; width: 55px; height: 55px;
    border: 1px solid #ffffff29; border-radius: 50%;
    background: linear-gradient(168deg, #ffffff18, #ffffff08 75%);
    color: #e5e7ed; cursor: pointer; font: 650 20px -apple-system, sans-serif;
  }
  .engine-toggle:hover, .engine-toggle[aria-expanded="true"], .engine-choice:hover { background-color: #ffffff17; }
  .engine-menu {
    position: absolute; top: calc(100% + 9px); right: 0;
    display: flex; gap: 5px; padding: 6px; border-radius: 24px;
    border: 1px solid #ffffff2a; background: #2b2b2ef5;
    box-shadow: 0 12px 32px #0007;
  }
  .engine-menu[hidden] { display: none; }
  .engine-choice { width: 35px; height: 35px; border-color: transparent; background: transparent; font-size: 17px; }
  .engine-choice[aria-pressed="true"] { border-color: #ffffff40; background: #ffffff12; }
  .engine-mark { width: 19px; height: 19px; background: center / contain no-repeat; }
  .engine-toggle .engine-mark { width: 23px; height: 23px; }

  .composer-panel:focus-within { border-color: #ffffff3b; }
  .composer-icon {
    width: 15px; height: 15px; border: 1.8px solid #aaaab0;
    border-radius: 50%; position: relative; flex: none;
  }
  .composer-icon::after {
    content: ''; position: absolute; width: 7px; height: 1.8px;
    right: -5px; bottom: -3px; border-radius: 1px; background: #aaaab0; transform: rotate(45deg);
  }
  .composer .address {
    flex: 1; min-width: 0; height: 100%; padding: 0;
    border: 0; border-radius: 0; background: none; box-shadow: none; font: inherit; font-size: 20px;
    letter-spacing: -.015em; caret-color: #efeff2;
  }
  .composer .address:focus-visible { outline: none; box-shadow: none; }
  .composer .address::placeholder { color: #aaaab0; }
  .composer-key { color: #a6a6ad; font: inherit; font-size: 16px; }
  .composer .address:placeholder-shown + .composer-key { visibility: hidden; }
  @media (prefers-reduced-transparency: reduce) {
    .composer-panel { background: #2d2d30; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .composer:not([hidden]) { animation: veil-in 190ms ease-out; }
    .composer:not([hidden]) .composer-row { animation: panel-in 220ms cubic-bezier(.2,.8,.25,1); }
    @keyframes veil-in { from { opacity: 0; } }
    @keyframes panel-in { from { opacity: 0; transform: translate(-50%, -12px) scale(.97); } }
  }
  .history-tool { display: none; font-size: 16px; }
  .https-preview .history-tool { display: flex; }
  .private-preview .history-tool, .private-preview .preview-label .standard-label { display: none; }
  .preview-label .private-label { display: none; }
  .private-preview .preview-label .private-label { display: inline; color: #c5adf3; }
  .history-panel {
    width: min(680px, calc(100% - 48px)); margin: min(12vh, 94px) auto 0;
    padding: 20px; border-radius: 22px; border: 1px solid #ffffff24;
    background: #242428; box-shadow: 0 20px 50px #0007;
  }
  .history-head { display: flex; align-items: center; gap: 10px; }
  .history-head h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
  .history-action { background: #ffffff10; border: 0; border-radius: 8px; color: inherit; padding: 7px 10px; cursor: pointer; }
  .history-action:disabled { opacity: .45; cursor: default; }
  .history-filter { margin: 14px 0 7px; width: 100%; }
  .history-list { max-height: 56vh; overflow: auto; padding: 3px; }
  .history-item { display: flex; align-items: center; gap: 7px; border-top: 1px solid #ffffff10; padding: 5px 0; }
  .history-item button:first-child { flex: 1; min-width: 0; text-align: left; }
  .history-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item span + span, .history-empty { color: #acacb3; font-size: 12px; }
  .developer-preview .composer-engine, .developer-preview .preview-label .private-label { display: none; }
  .developer-tool, .preview-label .developer-label { display: none; }
  .developer-tool { font-size: 12px; padding: 0 9px; }
  .developer-preview .developer-tool, .developer-preview .preview-label .developer-label { display: inline-block; }
  .preview-label { display: none; }
  .https-preview .preview-label { display: inline; flex: none; color: #aeb3bc; font-size: 11px; white-space: nowrap; }

  #settings { position: fixed; inset: 50px 0 0; overflow: auto; background: var(--settings-bg); color: var(--settings-text); }
  :root { --settings-bg: #16181d; --settings-card: #20242c; --settings-line: #3a424f; --settings-text: #edf0f6; --settings-muted: #b3bccc; --settings-accent: #bbd9ff; --settings-ink: #132646; }
  :root[data-palette="midnight"] { --settings-bg: #0c1424; --settings-card: #15223a; --settings-line: #364d70; --settings-accent: #afd6ff; }
  :root[data-palette="paper"] { --settings-bg: #edeae2; --settings-card: #fcfaf4; --settings-line: #bcb9ae; --settings-text: #22241e; --settings-muted: #53564d; --settings-accent: #244d41; --settings-ink: #ffffff; }
  .settings-shell { max-width: 920px; margin: auto; padding: clamp(16px, 4vw, 44px); }
  .settings-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .settings-top h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.045em; }
  .settings-top button, .settings-shell select, .settings-shell input[type="search"], .settings-actions button { border: 1px solid var(--settings-line); border-radius: 8px; padding: 8px 12px; color: inherit; background: var(--settings-card); font: inherit; }
  .settings-top button, .settings-actions button { cursor: pointer; min-height: 36px; }
  .settings-shell :focus-visible { outline-color: var(--settings-accent); }
  #settings-filter { margin: 18px 0 10px; width: 100%; }
  #settings-filter::placeholder { color: var(--settings-muted); }
  .settings-shell fieldset { min-width: 0; margin: 16px 0; padding: 4px 14px; border: 1px solid var(--settings-line); border-radius: 12px; background: var(--settings-card); }
  .settings-shell legend { padding: 0 6px; margin-left: -6px; font-weight: 650; font-size: 15px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; min-height: 48px; gap: 16px; padding: 8px 0; }
  .setting-row + .setting-row { border-top: 1px solid var(--settings-line); }
  .setting-row[hidden] { display: none; }
  .setting-row small { display: block; margin-top: 4px; color: var(--settings-muted); line-height: 1.4; }
  .setting-row input { width: 18px; height: 18px; accent-color: var(--settings-accent); flex: none; }
  .settings-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .settings-actions button[type="submit"] { background: var(--settings-accent); color: var(--settings-ink); font-weight: 650; }
  .settings-secondary { color: inherit; background: var(--settings-bg); border: 1px solid var(--settings-line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .settings-secondary:disabled { opacity: .55; cursor: default; }
  #download-custom-path { overflow-wrap: anywhere; }
  .settings-actions button:disabled { opacity: .55; cursor: default; }
  #settings-status { color: var(--settings-muted); }
  :root[data-palette="midnight"] .bar { background: linear-gradient(110deg,#253958ee,#101a30ee); }
  :root[data-palette="paper"] .bar { background: #d9d5ca; }
  :root[data-palette="paper"] .bar :is(.tool,.tab,.address,.preview-label) { color: #272b25; }
  :root[data-palette="paper"] .tab.active { background: #faf7ee; }
  :root[data-palette="paper"] .tab .dot.loading { border-color: #425e54; border-top-color: transparent; }
  :root[data-palette="paper"] .bar :focus-visible { outline-color: #244d41; }
  :root[data-compact] .tab { flex-basis: 100px; height: 28px; }
  :root[data-opaque] .bar { background: #272930; }
  :root[data-opaque][data-palette="midnight"] .bar { background: #172640; }
  :root[data-opaque] .composer { backdrop-filter: none; -webkit-backdrop-filter: none; background: #14161d; }
  :root[data-opaque][data-palette="paper"] .bar { background: #d9d5ca; }
  :root[data-quiet] *, :root[data-quiet] *::before { animation: none !important; transition: none !important; }

  <span class="notice" id="notice" role="status" aria-live="polite"></span>
</div>
<input class="address" id="address" aria-label="Адрес" placeholder="Адрес или сайт" hidden aria-describedby="notice">
<div id="composer" class="composer" role="dialog" aria-label="Быстрый поиск" aria-modal="true" hidden>
  <div class="composer-row">
    <div id="composer-panel" class="composer-panel"><span class="composer-icon" aria-hidden="true"></span><kbd class="composer-key" aria-hidden="true">↵</kbd></div>
    <div class="composer-engine">
      <button id="engine-toggle" class="engine-toggle" type="button" aria-label="Поисковая система: Google" aria-expanded="false" aria-controls="engine-menu"><span id="engine-mark" class="engine-mark" data-engine="google" aria-hidden="true"></span></button>
      <div id="engine-menu" class="engine-menu" role="group" aria-label="Выбор поисковой системы" hidden>
        <button id="engine-google" class="engine-choice" type="button" aria-label="Google" title="Google" aria-pressed="true"><span class="engine-mark" data-engine="google" aria-hidden="true"></span></button>
        <button id="engine-yandex" class="engine-choice" type="button" aria-label="Яндекс" title="Яндекс" aria-pressed="false"><span class="engine-mark" data-engine="yandex" aria-hidden="true"></span></button>
        <button id="engine-duckduckgo" class="engine-choice" type="button" aria-label="DuckDuckGo" title="DuckDuckGo" aria-pressed="false"><span class="engine-mark" data-engine="duckduckgo" aria-hidden="true"></span></button>
        <button id="engine-bing" class="engine-choice" type="button" aria-label="Bing" title="Bing" aria-pressed="false"><span class="engine-mark" data-engine="bing" aria-hidden="true"></span></button>
      </div>
    </div>
  </div>
</div>
<div id="history" class="composer" role="dialog" aria-label="История" aria-modal="true" hidden>
  <section class="history-panel">
    <div class="history-head"><h1 id="library-title">История</h1><button id="history-clear" class="history-action" type="button">Очистить</button><button id="history-close" class="history-action" type="button" aria-label="Закрыть историю">×</button></div>
    <input id="history-filter" class="address history-filter" type="search" aria-label="Поиск по истории" placeholder="Поиск по истории">
    <div id="library-error" class="history-empty" role="alert"></div><div id="history-status" class="history-empty" role="status"></div>
    <div id="history-list" class="history-list"></div>
  </section>
</div>
<div id="download-dialog" class="composer" role="dialog" aria-label="Скачать файл" aria-modal="true" hidden>
  <form class="history-panel" id="download-form">
    <div class="history-head"><h1>Скачать файл</h1><button id="download-close" class="history-action" type="button" aria-label="Закрыть">×</button></div>
    <input id="download-address" class="address history-filter" type="url" aria-label="Прямая ссылка на файл" placeholder="https://…" required>
    <button id="download-save" class="history-action" type="submit">Выбрать место сохранения</button>
  </form>
</div>
<section id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
  <div class="settings-shell">
    <header class="settings-top"><h1 id="settings-title">Настройки Search</h1><button id="settings-close" type="button">Готово</button></header>
    <input id="settings-filter" type="search" aria-label="Найти настройку" placeholder="Найти настройку">
    <p id="settings-empty" hidden>Ничего не найдено.</p>
    <form id="settings-form">
      <fieldset><legend>Оформление</legend>
        <label class="setting-row"><span>Цвет панели</span><select name="palette"><option value="graphite">Графит</option><option value="midnight">Полночь</option><option value="paper">Бумага</option><option value="system">Как в системе</option></select></label>
        <label class="setting-row"><span>Компактные вкладки<small>На панели помещается больше вкладок.</small></span><input type="checkbox" name="compact_tabs"></label>
        <label class="setting-row"><span>Меньше движения<small>Отключает анимации панели и окна быстрого поиска.</small></span><input type="checkbox" name="reduced_motion"></label>
        <label class="setting-row"><span>Непрозрачная панель<small>Убирает прозрачность панели и размытие в диалогах.</small></span><input type="checkbox" name="opaque_toolbar"></label>
      </fieldset>
      <fieldset><legend>Поиск</legend>
        <label class="setting-row"><span>Поисковик в обычном окне</span><select name="engine"><option value="google">Google</option><option value="yandex">Яндекс</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select></label>
        <label class="setting-row"><span>Поисковик во временном окне</span><select name="private_engine"><option value="google">Google</option><option value="yandex">Яндекс</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select></label>
      </fieldset>
      <fieldset id="page-zoom-group"><legend>Контент</legend>
        <label class="setting-row"><span>Масштаб страниц<small>Применяется к сайтам в обычном и временном окне.</small></span><select name="page_zoom"><option value="75">75%</option><option value="90">90%</option><option value="100">100%</option><option value="110">110%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></label>
      </fieldset>
      <fieldset><legend>Загрузки</legend>
        <label class="setting-row"><span>Начальная папка<small>Search откроет её в окне сохранения. Путь можно изменить перед скачиванием.</small></span><select name="download_folder"><option value="recent">Последняя использованная</option><option value="downloads">Загрузки</option><option value="desktop">Рабочий стол</option><option value="documents">Документы</option><option id="download-custom-option" value="custom" disabled>Выбранная папка</option></select></label>
        <div class="setting-row"><span>Выбранная папка<small id="download-custom-path">Папка не выбрана</small><small>Путь сохраняется сразу после выбора.</small></span><button class="settings-secondary" id="choose-download-folder" type="button">Выбрать…</button></div>
      </fieldset>
      <fieldset><legend>Запуск и история</legend>
        <label class="setting-row"><span>Восстанавливать вкладки<small>Если выключено, следующий запуск начнётся с новой вкладки.</small></span><input type="checkbox" name="restore_tabs"></label>
        <label class="setting-row"><span>Записывать историю<small>Управляет записью новых посещений. Старые записи можно удалить в истории.</small></span><input type="checkbox" name="record_history"></label>
      </fieldset>
      <div class="settings-actions"><button id="settings-save" type="submit" disabled>Применить</button><button id="settings-reset" type="button">По умолчанию</button><span id="settings-status" role="status"></span></div>
    </form>
  </div>
</section>
<script>
  'use strict';
  const tabs = document.getElementById('tabs'), address = document.getElementById('address'), notice = document.getElementById('notice'), activity = document.getElementById('activity');
  const tabsLeft = document.getElementById('tabs-left'), tabsRight = document.getElementById('tabs-right');
  function updateTabScroll() {
    const controlsWidth = tabsLeft.hidden ? 0 : tabsLeft.offsetWidth + tabsRight.offsetWidth;
    const overflow = tabs.scrollWidth > tabs.clientWidth + controlsWidth + 1;
    tabsLeft.hidden = tabsRight.hidden = !overflow;
    tabsLeft.disabled = tabs.scrollLeft <= 1;
    tabsRight.disabled = tabs.scrollLeft >= tabs.scrollWidth - tabs.clientWidth - 1;
  }
  tabsLeft.onclick = () => tabs.scrollBy({left:-tabs.clientWidth});
  tabsRight.onclick = () => tabs.scrollBy({left:tabs.clientWidth});
  tabs.addEventListener('scroll', updateTabScroll);
  new ResizeObserver(updateTabScroll).observe(tabs.parentElement);
  let editorTab;
  let renderingTabs = false;
  let focusNewTab = false;
  let composerOpen = false;
  let composerClosing = false;
  const composer = document.getElementById('composer');
  const composerPanel = document.getElementById('composer-panel');
  let selectedEngine = 'google';
  const engineToggle = document.getElementById('engine-toggle');
  const engineMenu = document.getElementById('engine-menu');
  const engineMark = document.getElementById('engine-mark');
  const engines = [
    ['google', 'Google'], ['yandex', 'Яндекс'],
    ['duckduckgo', 'DuckDuckGo'], ['bing', 'Bing'],
  ].map(([key, name]) => ({key, name, button:document.getElementById(`engine-${key}`)}));
  function setEngineMenu(open) {
    engineMenu.hidden = !open;
    engineToggle.setAttribute('aria-expanded', String(open));
  }
  function updateEngine() {
    const selected = engines.find(engine => engine.key === selectedEngine) ?? engines[0];
    engineMark.dataset.engine = selected.key;
    engineToggle.setAttribute('aria-label', `Поисковая система: ${selected.name}`);
    for (const engine of engines) engine.button.setAttribute('aria-pressed', String(engine === selected));
  }
  window.restoreSearchEngine = key => {
    selectedEngine = key;
    updateEngine();
  };
  engineToggle.onclick = () => setEngineMenu(engineMenu.hidden);
  for (const engine of engines) engine.button.onclick = () => {
    selectedEngine = engine.key;
    send({type:'set-search-engine', engine:engine.key});
    updateEngine();
    setEngineMenu(false);
    address.focus();
  };

  const isPreview = () => document.documentElement?.classList.contains('https-preview');
  function editAddress() {
    if (!editorTab) return;
    editorTab.classList.add('editing');
    address.hidden = false;
    editorTab.scrollIntoView({block:'nearest',inline:'nearest'});
    address.focus();
    address.select();
  }
  function hideAddress() {
    if (renderingTabs || composerOpen) return;
    editorTab?.classList.remove('editing');
    address.hidden = true;
  }
  address.addEventListener('blur', hideAddress);
  const send = value => window.ipc.postMessage(JSON.stringify(value));
  const developerMode = () => document.documentElement?.classList.contains('developer-preview');
  const inspectPage = document.getElementById('inspect-page');
  inspectPage.onclick = () => send({type:'inspect-page'});
  document.getElementById('developer-window').onclick = () => send({type:'developer-window'});
  document.getElementById('private-window').onclick = () => send({type:'private-window'});
  const downloadDialog = document.getElementById('download-dialog');
  const downloadOpen = document.getElementById('download-open');
  const downloadAddress = document.getElementById('download-address');
  const downloadClose = document.getElementById('download-close');
  const downloadSave = document.getElementById('download-save');
  let downloadShowing = false;
  let downloadActive = false;
  function dismissDownload() {
    downloadShowing = false;
    downloadDialog.hidden = true;
    send({type:'composer', visible:false});
    downloadOpen.focus();
  }
  window.setDownloadActive = active => {
    downloadActive = active;
    const label = active ? 'Отменить загрузку' : 'Скачать по адресу';
    downloadOpen.dataset.active = String(active);
    downloadOpen.setAttribute('aria-label', label);
    downloadOpen.title = label;
  };
  downloadOpen.onclick = () => {
    if (downloadActive) {
      send({type:'cancel-download'});
      return;
    }
    const url = window.searchState.tabs[window.searchState.active]?.url;
    downloadAddress.value = url?.startsWith('https://') ? url : '';
    downloadShowing = true;
    downloadDialog.hidden = false;
    downloadAddress.focus();
    downloadAddress.select();
    send({type:'composer', visible:true});
  };
  downloadClose.onclick = dismissDownload;
  downloadDialog.onclick = event => { if (event.target === downloadDialog) dismissDownload(); };
  document.getElementById('download-form').onsubmit = event => {
    event.preventDefault();
    const value = downloadAddress.value.trim();
    const command = {type:'download-address', value};
    if (!value || new TextEncoder().encode(JSON.stringify(command)).length > 2048) return;
    dismissDownload();
    send(command);
  };
  const historyLayer = document.getElementById('history');
  const historyOpen = document.getElementById('history-open');
  const historyFilter = document.getElementById('history-filter');
  const historyList = document.getElementById('history-list');
  const historyClear = document.getElementById('history-clear');
  const historyClose = document.getElementById('history-close');
  const historyStatus = document.getElementById('history-status');
  const libraryError = document.getElementById('library-error');
  const bookmarksOpen = document.getElementById('bookmarks-open');
  const bookmarkToggle = document.getElementById('bookmark-toggle');
  const libraryTitle = document.getElementById('library-title');
  let historyShowing = false;
  let libraryKind = 'history';
  let historyEntries = [];
  let bookmarkEntries = [];
  function updateBookmarkButton() {
    const tab = window.searchState.tabs[window.searchState.active];
    const url = tab?.url;
    const saved = bookmarkEntries.some(entry => entry.url === url);
    bookmarkToggle.disabled = !url?.startsWith('https://') || Boolean(tab.loading);
    const name = saved ? 'Удалить закладку' : 'Сохранить закладку';
    bookmarkToggle.title = name;
    bookmarkToggle.setAttribute('aria-label', name);
    bookmarkToggle.setAttribute('aria-pressed', String(saved));
  }
  bookmarkToggle.onclick = () => {
    if (!bookmarkToggle.disabled) send({type:'bookmark-toggle'});
  };
  function dismissHistory() {
    historyShowing = false;
    historyLayer.hidden = true;
    send({type:'composer', visible:false});
    (libraryKind === 'history' ? historyOpen : bookmarksOpen).focus();
  }
  function drawHistory() {
    const query = historyFilter.value.trim().toLocaleLowerCase();
    const entries = libraryKind === 'history' ? historyEntries : bookmarkEntries;
    const matches = entries.filter(entry => `${entry.title} ${entry.url}`.toLocaleLowerCase().includes(query));
    historyClear.hidden = libraryKind !== 'history';
    historyClear.disabled = historyClear.hidden || historyEntries.length === 0;
    historyStatus.textContent = matches.length ? '' : query ? 'Ничего не найдено' : libraryKind === 'history' ? 'История пуста' : 'Закладок пока нет';
    historyList.replaceChildren();
    for (const entry of matches) {
      const row = document.createElement('div');
      row.className = 'history-item';
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'history-action';
      const title = document.createElement('span');
      title.textContent = entry.title;
      const url = document.createElement('span');
      url.textContent = entry.url;
      link.append(title, url);
      link.onclick = () => {
        dismissHistory();
        send({type:'open', value:entry.url});
      };
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'history-action';
      remove.textContent = '×';
      remove.setAttribute('aria-label', `${libraryKind === 'history' ? 'Удалить из истории' : 'Удалить закладку'}: ${entry.title}`);
      remove.onclick = () => {
        historyFilter.focus();
        send({type:libraryKind === 'history' ? 'history-remove' : 'bookmark-remove', value:entry.url});
      };
      row.append(link, remove);
      historyList.append(row);
    }
  }
  window.renderHistory = entries => {
    historyEntries = entries;
    if (historyShowing && libraryKind === 'history') drawHistory();
  };
  window.renderBookmarks = entries => {
    bookmarkEntries = entries;
    updateBookmarkButton();
    if (historyShowing && libraryKind === 'bookmarks') drawHistory();
  };
  function openLibrary(kind) {
    libraryKind = kind;
    const title = kind === 'history' ? 'История' : 'Закладки';
    libraryTitle.textContent = title;
    historyLayer.setAttribute('aria-label', title);
    historyClose.setAttribute('aria-label', kind === 'history' ? 'Закрыть историю' : 'Закрыть закладки');
    historyFilter.placeholder = kind === 'history' ? 'Поиск по истории' : 'Поиск по закладкам';
    historyFilter.setAttribute('aria-label', historyFilter.placeholder);
    historyShowing = true;
    libraryError.textContent = '';
    historyLayer.hidden = false;
    historyFilter.value = '';
    historyFilter.focus();
    drawHistory();
    send({type:'composer', visible:true});
    send({type:kind === 'history' ? 'history-list' : 'bookmarks-list'});
  }
  historyOpen.onclick = () => openLibrary('history');
  bookmarksOpen.onclick = () => openLibrary('bookmarks');
  historyClose.onclick = dismissHistory;
  historyLayer.onclick = event => { if (event.target === historyLayer) dismissHistory(); };
  historyFilter.addEventListener('input', drawHistory);
  historyClear.onclick = () => {
    historyFilter.focus();
    send({type:'history-clear'});
  };

  function showComposer() {
    composerOpen = true;
    composer.hidden = false;
    updateEngine();
    setEngineMenu(false);
    composerPanel.insertBefore(address, composerPanel.lastElementChild);
    address.hidden = false;
    send({type:'composer', visible:true});
    address.focus();
  }
  function dismissComposer(done) {
    if (composerClosing) return;
    composerClosing = true;
    const finish = () => {
      composerOpen = composerClosing = false;
      composer.hidden = true;
      setEngineMenu(false);
      editorTab?.append(address);
      hideAddress();
      send({type:'composer', visible:false});
      done();
    };
    if (!composerPanel.animate || appliedSettings.reduced_motion || matchMedia('(prefers-reduced-motion: reduce)').matches || !editorTab) {
      finish();
      return;
    }
    const panel = composerPanel.getBoundingClientRect();
    const tab = editorTab.getBoundingClientRect();
    const x = tab.left + tab.width / 2 - panel.left - panel.width / 2;
    const y = tab.top + tab.height / 2 - panel.top - panel.height / 2;
    const motion = {duration: 235, easing: 'cubic-bezier(.3,.05,.2,1)', fill: 'forwards'};
    const veil = composer.animate([{opacity:1}, {opacity:.1}], motion);
    const flight = composerPanel.animate([
      {transform:'translate(0, 0) scale(1)', opacity:1},
      {transform:`translate(${x}px, ${y}px) scale(${tab.width / panel.width}, ${tab.height / panel.height})`, opacity:.35},
    ], motion);
    const settle = () => {
      veil.cancel();
      flight.cancel();
      finish();
    };
    flight.finished.then(settle, settle);
  }
  composer.onclick = event => {
    if (event.target === composer) address.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape'}));
  };
  function newTab() {
    focusNewTab = Boolean(isPreview());
    send({type:'new'});
  }
  document.getElementById('add').onclick = newTab;
  document.getElementById('back').onclick = () => send({type:'back'});
  document.getElementById('forward').onclick = () => send({type:'forward'});
  document.getElementById('reload').onclick = () => send({type:'reload'});
  address.addEventListener('keydown', e => {
    if(e.isComposing) return;
    if(e.key === 'Escape') {
      e.preventDefault();
      if (composerOpen && !engineMenu.hidden) {
        setEngineMenu(false);
        return;
      }
      const {active, tabs: stateTabs} = window.searchState;
      address.value = displayAddress(stateTabs[active]?.url);
      notice.textContent = '';
      address.setAttribute('aria-invalid', 'false');
      const cancel = () => {
        send({type:'cancel-address'});
        address.blur();
        editorTab?.querySelector('[role="tab"]')?.focus();
      };
      if (composerOpen) dismissComposer(cancel);
      else cancel();
      return;
    }
    if(e.key!=='Enter' || !address.value.trim()) return;
    const command={type:'open',value:address.value};
    if (document.documentElement?.classList.contains('https-preview')) {
      command.engine = selectedEngine;
    }
    const encoder=new TextEncoder();
    if(encoder.encode(address.value).length>1024 || encoder.encode(JSON.stringify(command)).length>2048) {
      notice.textContent='Адрес слишком длинный. Сократи его и попробуй снова.';
      address.setAttribute('aria-invalid','true');
      return;
    }
    if (composerOpen) {
      e.preventDefault();
      dismissComposer(() => send(command));
    } else {
      send(command);
      address.blur();
    }
  });
  address.addEventListener('input', () => { notice.textContent=''; address.setAttribute('aria-invalid','false'); });
  function tabShortcut(event, state) {
    if (event.altKey || !state.tabs.length) return;
    const count = state.tabs.length;
    if (event.ctrlKey && !event.metaKey && event.key === 'Tab') {
      const direction = event.shiftKey ? -1 : 1;
      return state.tabs[(state.active + direction + count) % count];
    }
    if ((event.metaKey || event.ctrlKey) && !event.shiftKey && /^[1-9]$/.test(event.key)) {
      return state.tabs[event.key === '9' ? count - 1 : Number(event.key) - 1];
    }
  }
  const toolbar = document.getElementById('toolbar');
  const settingsDialog = document.getElementById('settings');
  const settingsOpen = document.getElementById('settings-open');
  const settingsClose = document.getElementById('settings-close');
  const settingsFilter = document.getElementById('settings-filter');
  const settingsForm = document.getElementById('settings-form');
  const settingsSave = document.getElementById('settings-save');
  const settingsStatus = document.getElementById('settings-status');
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const defaults = {engine:'google', private_engine:'google', palette:'graphite', compact_tabs:false,
    reduced_motion:false, opaque_toolbar:false, restore_tabs:true, record_history:true, page_zoom:'100', download_folder:'recent'};
  let appliedSettings = defaults;
  let settingsShowing = false;
  let savingSettings = false;
  function fillSettings(values) {
    for (const [name, value] of Object.entries(values)) {
      const control = settingsForm.elements.namedItem(name);
      if (typeof value === 'boolean') control.checked = value;
      else control.value = value;
    }
  }
  function readSettings() {
    return Object.fromEntries(Object.keys(defaults).map(name => {
      const control = settingsForm.elements.namedItem(name);
      return [name, control.type === 'checkbox' ? control.checked : control.value];
    }));
  }
  function applyAppearance() {
    const root = document.documentElement;
    const {palette, compact_tabs, reduced_motion, opaque_toolbar} = appliedSettings;
    root.dataset.palette = palette === 'system' ? (systemDark.matches ? 'graphite' : 'paper') : palette;
    root.toggleAttribute('data-compact', compact_tabs);
    root.toggleAttribute('data-quiet', reduced_motion);
    root.toggleAttribute('data-opaque', opaque_toolbar);
  }
  window.renderSettings = (values, privateMode, outcome) => {
    appliedSettings = values;
    applyAppearance();
    window.restoreSearchEngine(privateMode ? values.private_engine : values.engine);
    if (outcome === null) return;
    savingSettings = false;
    if (outcome === 'saved' || outcome === 'conflict') fillSettings(values);
    settingsEdited();
    if (settingsShowing) (settingsSave.disabled ? settingsClose : settingsSave).focus();
    settingsStatus.textContent = {
      saved:'Настройки сохранены',
      conflict:'Настройки изменились в другом окне. Загружены актуальные значения.',
      failed:'Не удалось сохранить настройки. Попробуйте ещё раз.',
      'folder-unavailable':'Выбранная папка недоступна. Выбери новую папку или стандартный вариант.',
    }[outcome];
  };
  systemDark.addEventListener?.('change', applyAppearance);
  function filterSettings() {
    const query = settingsFilter.value.trim().toLocaleLowerCase();
    let visible = false;
    for (const group of settingsForm.querySelectorAll('fieldset')) {
      group.hidden = true;
      if (group.dataset.unavailable) continue;
      for (const row of group.querySelectorAll('.setting-row')) {
        row.hidden = !`${group.querySelector('legend').textContent} ${row.textContent}`.toLocaleLowerCase().includes(query);
        if (!row.hidden) group.hidden = false;
      }
      if (!group.hidden) visible = true;
    }
    document.getElementById('settings-empty').hidden = visible;
  }
  settingsOpen.onclick = () => {
    if (savingSettings) return;
    settingsShowing = true;
    toolbar.inert = true;
    settingsDialog.hidden = false;
    settingsFilter.value = '';
    settingsStatus.textContent = '';
    settingsSave.disabled = true;
    fillSettings(appliedSettings);
    filterSettings();
    send({type:'composer', visible:true});
    settingsFilter.focus();
  };
  function closeSettings() {
    settingsShowing = false;
    toolbar.inert = false;
    settingsDialog.hidden = true;
    send({type:'composer', visible:false});
    settingsOpen.focus();
  }
  settingsClose.onclick = closeSettings;
  settingsFilter.addEventListener('input', filterSettings);
  function settingsEdited() {
    const draft = readSettings();
    settingsSave.disabled = savingSettings || Object.keys(defaults).every(name => draft[name] === appliedSettings[name]);
    settingsStatus.textContent = settingsSave.disabled ? '' : 'Есть несохранённые изменения';
  }
  const folderPicker = document.getElementById('choose-download-folder');
  const customFolderOption = document.getElementById('download-custom-option');
  const customFolderPath = document.getElementById('download-custom-path');
  folderPicker.onclick = () => {
    folderPicker.disabled = true;
    send({type:'choose-download-folder'});
  };
  window.renderDownloadFolder = (path, result) => {
    folderPicker.disabled = false;
    customFolderOption.disabled = path === null;
    customFolderPath.textContent = path ?? 'Папка не выбрана';
    if (!settingsShowing) return;
    if (result === 'selected') {
      settingsForm.elements.namedItem('download_folder').value = 'custom';
      settingsEdited();
    } else if (result === 'failed') {
      settingsStatus.textContent = 'Не удалось сохранить папку.';
    }
    if (result === 'selected' || result === 'failed' || result === 'cancelled') folderPicker.focus();
  };
  settingsForm.addEventListener('change', settingsEdited);
  document.getElementById('settings-reset').onclick = () => {
    if (savingSettings) return;
    fillSettings(defaults);
    settingsEdited();
  };
  settingsForm.onsubmit = event => {
    event.preventDefault();
    if (savingSettings || settingsSave.disabled) return;
    savingSettings = true;
    settingsSave.disabled = true;
    send({type:'save-settings', settings:readSettings()});
  };
  function handleShortcut(e) {
    if (e.isComposing || e.defaultPrevented) return;
    if (settingsShowing) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeSettings();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const controls = [...settingsDialog.querySelectorAll('button, input, select')]
          .filter(control => control.offsetWidth && !control.disabled);
        const index = controls.indexOf(document.activeElement);
        controls[(index < 0 ? (e.shiftKey ? controls.length - 1 : 0) :
          (index + (e.shiftKey ? -1 : 1) + controls.length) % controls.length)].focus();
      }
      return;
    }
    if (downloadShowing) {
      if (e.key === 'Escape') {
        e.preventDefault();
        dismissDownload();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const controls = [downloadAddress, downloadSave, downloadClose];
        const index = controls.indexOf(document.activeElement);
        controls[(index + (e.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
      }
      return;
    }
    if (historyShowing) {
      if (e.key === 'Escape') {
        e.preventDefault();
        dismissHistory();
      } else if (e.key === 'Tab') {
        const controls = [...historyLayer.querySelectorAll('input, button:not(:disabled)')];
        if (controls.length) {
          e.preventDefault();
          const index = controls.indexOf(document.activeElement);
          controls[(index + (e.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
        }
      }
      return;
    }
    if (composerOpen) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const controls = developerMode() ? [address] : [address, engineToggle, ...(engineMenu.hidden ? [] : engines.map(engine => engine.button))];
        const index = controls.indexOf(document.activeElement);
        controls[(index + (e.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
      } else if (e.key === 'Escape' && !engineMenu.hidden) {
        setEngineMenu(false);
        address.focus();
      } else if (e.key === 'Escape' && document.activeElement !== address) {
        address.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape'}));
      }
      return;
    }
    if (e.repeat && (e.metaKey || e.ctrlKey) && ['t', 'w'].includes(e.key.toLowerCase())) {
      e.preventDefault();
      return;
    }
    const target = tabShortcut(e, window.searchState);
    if (target) {
      e.preventDefault();
      if (target.id !== window.searchState.tabs[window.searchState.active]?.id) {
        if (document.activeElement?.getAttribute('role') === 'tab') {
          const index = window.searchState.tabs.indexOf(target);
          tabs.querySelector(`[role="tab"][data-index="${index}"]`)?.focus({preventScroll:true});
        }
        send({type:'select',id:target.id});
      }
      return;
    }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='t') {
      e.preventDefault();
      if (e.shiftKey) send({type:'reopen'});
      else newTab();
    }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='l') { e.preventDefault(); editAddress(); }
    if(e.metaKey && (e.key === '[' || e.key === ']')) {
      e.preventDefault();
      send({type:e.key === '[' ? 'back' : 'forward'});
    }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='r') { e.preventDefault(); send({type:'reload'}); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='w') {
      e.preventDefault();
      const { active, tabs: stateTabs } = window.searchState;
      const tab = stateTabs[active];
      if(tab) send({type:'close',id:tab.id});
    }
  }
  document.addEventListener('keydown', handleShortcut);
  window.searchNativeShortcut = shortcut => handleShortcut({...shortcut, preventDefault() {}});
  const displayAddress = url => url === 'search:start' || url === 'about:blank' ? '' : url ?? '';
  window.searchState = {active:0,tabs:[]};
  function renderTabs(state, previous, activeChanged) {
    const focused = document.activeElement;
    const focusedIndex = focused?.dataset?.index;
    const focusedAction = focused?.dataset?.action;
    const keepEditor = focused === address && !activeChanged;
    const selectionStart = address.selectionStart, selectionEnd = address.selectionEnd;
    renderingTabs = true;
    tabs.replaceChildren();
    state.tabs.forEach((tab,index) => {
      const item = document.createElement('div'); item.className='tab'+(index===state.active?' active':'')+(index===state.active && activeChanged?' just-selected':'');
      if (previous.tabs.length && !previous.tabs.some(before => before.id === tab.id)) item.className += ' just-opened';
      const button = document.createElement('button'); button.className='select'; button.type='button'; button.dataset.action='select'; button.dataset.index=index; button.setAttribute('role','tab'); button.setAttribute('aria-selected',index===state.active?'true':'false'); button.setAttribute('aria-label',tab.loading?tab.label+' загружается':tab.label); button.tabIndex=index===state.active?0:-1;
      const dot=document.createElement('span'); dot.className='dot'+(tab.loading?' loading':'');
      const name=document.createElement('span'); name.className='name'; name.textContent=tab.label; button.title=tab.label;
      const close=document.createElement('button'); close.className='close'; close.type='button'; close.dataset.action='close'; close.dataset.index=index; close.textContent='×'; close.setAttribute('aria-label','Закрыть вкладку '+tab.label);
      close.disabled = state.tabs.length === 1;
      close.onclick=()=>send({type:'close',id:tab.id});
      button.onclick=()=>index===state.active ? editAddress() : send({type:'select',id:tab.id});
      button.addEventListener('auxclick', event => {
        if (event.button === 1 && !close.disabled) {
          event.preventDefault();
          close.onclick();
        }
      });
      button.append(dot,name);
      if (tab.url === 'search:start') {
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = developerMode() ? 'Локальный адрес' : isPreview() ? 'Поиск или адрес' : 'Адрес или сайт';
        hint.setAttribute('aria-hidden', 'true');
        button.append(hint);
      }
      item.append(button,close);
      if (index===state.active) {
        editorTab = item;
        if (!composerOpen) item.append(address);
      }
      tabs.append(item);
    });
    renderingTabs = false;
    if (keepEditor && !composerOpen) {
      editAddress();
      if (selectionStart !== null) address.setSelectionRange(selectionStart, selectionEnd);
    } else {
      hideAddress();
    }
    updateTabScroll();
    if (activeChanged) tabs.querySelector(`[role="tab"][data-index="${state.active}"]`)?.scrollIntoView({block:'nearest',inline:'nearest'});
    if(focusedIndex!==undefined && state.tabs.length) {
      const previousIndex = Number(focusedIndex);
      const previousId = previous.tabs[previousIndex]?.id;
      const remainingIndex = previousId === undefined ? previousIndex
        : state.tabs.findIndex(tab => tab.id === previousId);
      const remaining = remainingIndex >= 0 && remainingIndex < state.tabs.length;
      const index = remaining ? remainingIndex : state.active;
      const action = remaining ? focusedAction : 'select';
      tabs.querySelector(`[data-action="${action}"][data-index="${index}"]`)?.focus({preventScroll:true});
    }
  }
  window.renderSearch = state => {
    if (isPreview()) address.placeholder = developerMode() ? 'localhost:3000' : 'Поиск или адрес';
    const previous = window.searchState;
    const currentId = state.tabs[state.active]?.id;
    const previousId = previous.tabs[previous.active]?.id;
    const activeChanged = currentId === undefined && previousId === undefined
      ? state.active !== previous.active : currentId !== previousId;
    const tabsChanged = activeChanged || state.active !== previous.active || state.tabs.length !== previous.tabs.length
      || state.tabs.some((tab, index) => {
        const before = previous.tabs[index];
        return tab.id !== before.id || tab.label !== before.label || (tab.url === 'search:start') !== (before.url === 'search:start') || tab.loading !== before.loading;
      });
    window.searchState = state;
    updateBookmarkButton();
    inspectPage.disabled = !state.tabs[state.active] || !/^https?:/.test(state.tabs[state.active].url) || Boolean(state.tabs[state.active].loading);
    if (tabsChanged) renderTabs(state, previous, activeChanged);

    const activeTab = state.tabs[state.active];
    const returnToSearch = !state.can_back && activeTab?.url === 'search:start'
      && document.documentElement?.classList.contains('developer-from-search');
    const back = document.getElementById('back');
    back.disabled = !state.can_back && !returnToSearch;
    back.title = returnToSearch ? 'Вернуться в Search' : 'Назад';
    back.setAttribute('aria-label', back.title);
    document.getElementById('forward').disabled = !state.can_forward;
    const composeNewTab = focusNewTab &&
      state.tabs.length > previous.tabs.length && !previous.tabs.some(tab => tab.id === activeTab?.id);
    if (composeNewTab || state.notice) focusNewTab = false;
    document.getElementById('reload').disabled = !activeTab || ['search:start', 'about:blank'].includes(activeTab.url);
    if(document.activeElement!==address || activeChanged) {
      const url = state.tabs[state.active]?.url;
      address.value = state.attempted_address ?? displayAddress(url);
    }
    if (composeNewTab) showComposer();
    else if (state.attempted_address != null && address.hidden) editAddress();
    notice.textContent=state.notice ?? '';
    if (historyShowing) libraryError.textContent = state.notice ?? '';
    activity.textContent=!state.notice && state.tabs[state.active]?.loading?'Загрузка страницы…':'';
    address.setAttribute('aria-invalid',state.attempted_address != null?'true':'false');
  };
  tabs.addEventListener('keydown', e => {
    const tab=e.target.closest('[role="tab"]');
    if(!tab) return;
    const index=Number(tab.dataset.index), count=window.searchState.tabs.length;
    if(!count) return;
    let next;
    if(e.key==='ArrowRight') next=(index+1)%count;
    else if(e.key==='ArrowLeft') next=(index+count-1)%count;
    else if(e.key==='Home') next=0;
    else if(e.key==='End') next=count-1;
    else if(e.key==='Delete') { e.preventDefault(); send({type:'close',id:window.searchState.tabs[index].id}); return; }
    else return;
    e.preventDefault();
    tabs.querySelector(`[role="tab"][data-index="${next}"]`)?.focus();
    send({type:'select',id:window.searchState.tabs[next].id});
  });
</script>
