<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
<title>Новая вкладка · Search</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #202021; color: #f2f2f2; }
  main { width: min(860px, calc(100vw - 72px)); margin: clamp(74px, 13vh, 150px) auto 64px; }
  h1 { margin: 0 0 27px; font-size: clamp(25px, 3vw, 34px); line-height: 1.15; letter-spacing: -.035em; font-weight: 650; }
  .sites { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 18px; }
  .site { display: flex; align-items: center; flex-direction: column; gap: 10px; min-width: 0; color: #e9e9ea; font-size: 14px; text-decoration: none; }
  .icon { width: 96px; height: 96px; display: grid; place-items: center; border-radius: 23px; background: #4a4a4d; color: #fff; font-size: 35px; font-weight: 650; letter-spacing: -.06em; box-shadow: inset 0 1px #ffffff22, 0 7px 22px #00000020; }
  .site:hover .icon { background: #5b5b5f; }
  .site:focus-visible { outline: 2px solid #d0d0d2; outline-offset: 7px; border-radius: 9px; }
  .caption { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .note { margin-top: clamp(70px, 13vh, 150px); border-top: 1px solid #ffffff18; padding-top: 27px; color: #a7a7aa; font-size: 14px; line-height: 1.5; }
  .note strong { display: block; color: #e0e0e1; font-size: 17px; margin-bottom: 6px; font-weight: 590; }
  @media (max-width: 640px) { main { width: calc(100vw - 40px); margin-top: 60px; } .sites { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 8px; } .icon { width: 76px; height: 76px; border-radius: 19px; font-size: 28px; } }
</style>
<main>
  <h1>Быстрый доступ</h1>
  <div class="sites">
    <a class="site" href="https://rust-lang.org/"><span class="icon" aria-hidden="true">R</span><span class="caption">Rust</span></a>
    <a class="site" href="https://www.wikipedia.org/"><span class="icon" aria-hidden="true">W</span><span class="caption">Wikipedia</span></a>
    <a class="site" href="https://excalidraw.com/"><span class="icon" aria-hidden="true">E</span><span class="caption">Excalidraw</span></a>
  </div>
  <div class="note"><strong>Первое окно Search</strong>Сейчас это экспериментальная версия. Открываются только выбранные сайты; остальные возможности браузера ещё в работе.</div>
</main>
</html>
