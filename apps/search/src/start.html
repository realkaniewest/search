<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
<title>Новая вкладка · Search</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 38% 0%, #282b30, #1e2023 62%); color: #ebedf0; }
  main { width: min(660px, calc(100% - 48px)); margin: clamp(52px, 14vh, 136px) auto 48px; }
  h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.2; letter-spacing: -.025em; font-weight: 620; }
  .sites { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .site {
    display: flex; min-width: 0; min-height: 60px; align-items: center; gap: 10px; padding: 10px;
    color: inherit; text-decoration: none; font-size: 13px; border: 1px solid #ffffff14;
    border-radius: 13px; background: #ffffff07;
  }
  .site:hover { background: #ffffff0e; border-color: #ffffff28; }
  .site:focus-visible { outline: 2px solid #d0d0d2; outline-offset: 3px; }
  .icon {
    display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 8px;
    background: #ffffff0d; color: #c6cbd3; font-size: 15px; font-weight: 560;
  }
  .caption { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .note { margin: 20px 0 0; color: #a5a8af; font-size: 12px; line-height: 1.5; }
  @media (prefers-reduced-motion: no-preference) {
    .site { transition: background-color 150ms ease, border-color 150ms ease; }
  }
  @media (max-width: 510px) {
    main { width: calc(100% - 32px); margin-top: 40px; }
    .sites { grid-template-columns: 1fr; gap: 8px; }
    .site { min-height: 50px; padding: 7px 10px; }
  }
</style>
<main>
  <h1>Быстрый доступ</h1>
  <div class="sites">
    <a class="site" href="https://rust-lang.org/"><span class="icon" aria-hidden="true">R</span><span class="caption">Rust</span></a>
    <a class="site" href="https://www.wikipedia.org/"><span class="icon" aria-hidden="true">W</span><span class="caption">Wikipedia</span></a>
    <a class="site" href="https://excalidraw.com/"><span class="icon" aria-hidden="true">E</span><span class="caption">Excalidraw</span></a>
  </div>
  <p class="note">Нажми на активную вкладку, чтобы ввести адрес.</p>
</main>
</html>
